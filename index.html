    /* MAP AND SIDEBAR LAYOUT */

.map-layout {
  display: flex;
  width: 100%;
  height: 75vh;
  min-height: 500px;
  background: #101827;
}

/* SIDEBAR */

.sidebar {
  width: 310px;
  min-width: 270px;
  background: #17243a;
  color: white;
  overflow-y: auto;
  padding: 18px;
  box-sizing: border-box;
  border-right: 1px solid #33445e;
}

.sidebar-header h2 {
  font-size: 21px;
  margin: 0 0 6px;
}

.sidebar-header p {
  color: #9aabc0;
  font-size: 13px;
  margin-bottom: 18px;
}

#destinationSearch {
  width: 100%;
  padding: 12px;
  box-sizing: border-box;
  border: 1px solid #43536b;
  border-radius: 7px;
  background: #101827;
  color: white;
  font-size: 14px;
  margin-bottom: 15px;
}

#destinationSearch::placeholder {
  color: #9aabc0;
}

#destinationCount {

  font-size: 12px;
  margin-bottom: 12px;
}

/* DESTINATION CARDS */

.destination-item {
  padding: 12px;
  border-bottom: 1px solid #33445e;
  cursor: pointer;
  transition: background 0.2s;
}

.destination-item:hover {

}

.destination-code {

  font-weight: bold;

}

.destination-city {

.destination-airlines {

  font-size: 11px;
  margin-top: 5px;

/* MAP */

#map {
  flex: 1;
  min-width: 0;
  height: 100%;
}

/* MOBILE RESPONSIVENESS */

@media (max-width: 700px) {
  .map-layout {
    flex-direction: column;
    height: auto;
  }

  .sidebar {
    width: 100%;
    height: 300px;
    min-width: 0;
  }

  #map {
    height: 550px;
    flex: none;
  }

  // Store destination markers for sidebar clicks
  const destinationMarkers = {};

  // Create curved flight route
  function createArc(start, end) {
    const points = [];

    const latDiff = end.lat - start.lat;
    const lngDiff = end.lng - start.lng;

    const distance = Math.sqrt(
      latDiff * latDiff + lngDiff * lngDiff
    );

    const bend = Math.min(distance * 0.16, 12);

    const midLat = (start.lat + end.lat) / 2
      + Math.abs(lngDiff) / distance * bend;

    const midLng = (start.lng + end.lng) / 2
      - latDiff / distance * bend;

    for (let i = 0; i <= 50; i++) {
      const t = i / 50;
      const inverse = 1 - t;

      const lat =
        inverse * inverse * start.lat +
        2 * inverse * t * midLat +
        t * t * end.lat;

      const lng =
        inverse * inverse * start.lng +
        2 * inverse * t * midLng +
        t * t * end.lng;

      points.push([lat, lng]);
    }

    return points;
  }

// Airline route colors
const airlineColors = {
  "Delta": "#2563eb",
  "Allegiant": "#22c55e",
  "Frontier": "#84cc16",
  "American": "#ef4444",
  "United": "#a855f7",

 // Draw map
  function drawMap() {
    airportLayer.clearLayers();
    routeLayer.clearLayers();

    const selectedAirline = filter.value;

    const filteredRoutes = routes.filter(route =>
      selectedAirline === "All" ||
      route.airline === selectedAirline
    );

    // CVG origin marker
    L.circleMarker(
      [airports.CVG.lat, airports.CVG.lng],
      {
        radius: 10,
        color: "#ffffff",
        fillColor: "#22c55e",
        fillOpacity: 1,
        weight: 3
      }
    )
    .bindPopup("<b>CVG</b><br>Cincinnati/Northern Kentucky")
    .addTo(airportLayer);

    const destinations = new Set();

    // Draw each airline route
    filteredRoutes.forEach(route => {
      const destination = airports[route.to];

      if (!destination) return;

      destinations.add(route.to);

      L.polyline(
        createArc(airports.CVG, destination),
        {
          color: airlineColors[route.airline] || "#ffffff",
          weight: 1,
          opacity: 0.9,
          dashArray: route.seasonal ? "6, 6" : null
        }
      )
      .bindPopup(
        "<b>CVG → " + route.to + "</b>" +
        "<br>Airline: " + route.airline +
        (route.seasonal
          ? "<br>Seasonal service"
          : "<br>Regular service")
      )
      .addTo(routeLayer);
    });

    // Clear old destination markers
    Object.keys(destinationMarkers).forEach(code => {
      delete destinationMarkers[code];
    });

    // Add destination airport markers
    destinations.forEach(code => {
      const airport = airports[code];

      const marker = L.circleMarker(
        [airport.lat, airport.lng],
        {
          radius: 6,
          color: "#ffffff",
          fillColor: "#f59e0b",
          fillOpacity: 1,
          weight: 2
        }
      );

      marker.bindPopup(
        "<b>" + code + "</b><br>" +
        airport.city +
        "<br>Origin: CVG"
      );

      marker.addTo(airportLayer);
      destinationMarkers[code] = marker;
    });

    // Update destination sidebar
    renderDestinations(filteredRoutes);

    // Update route statistics
    document.getElementById("stats").textContent =
      filteredRoutes.length + " route entries | " +
      destinations.size + " destinations";
  }
  
function renderDestinations(filteredRoutes) {

  const list = document.getElementById("destinationList");
  const count = document.getElementById("destinationCount");
  const search = document.getElementById("destinationSearch");

  list.innerHTML = "";

  const grouped = {};

  filteredRoutes.forEach(route => {
    if (!grouped[route.to]) {
      grouped[route.to] = [];
    }

    if (!grouped[route.to].includes(route.airline)) {
      grouped[route.to].push(route.airline);
    }
  });

  const searchText = search.value.toLowerCase();

  const matchingCodes = Object.keys(grouped)
    .filter(code => {
      const airport = airports[code];

      return airport && (
        code.toLowerCase().includes(searchText) ||
        airport.city.toLowerCase().includes(searchText) ||
        grouped[code].some(airline =>
          airline.toLowerCase().includes(searchText)
        )
      );
    })
    .sort((a, b) =>
      airports[a].city.localeCompare(airports[b].city)
    );

  count.textContent =
    matchingCodes.length + " destinations";

  matchingCodes.forEach(code => {

    const airport = airports[code];

    const item = document.createElement("div");
    item.className = "destination-item";

    const airportCode = document.createElement("div");
    airportCode.className = "destination-code";
    airportCode.textContent = code;

    const city = document.createElement("div");
    city.className = "destination-city";
    city.textContent = airport.city;

    const airlines = document.createElement("div");
    airlines.className = "destination-airlines";
    airlines.textContent = grouped[code].join(" • ");

    item.appendChild(airportCode);
    item.appendChild(city);
    item.appendChild(airlines);
    
// Flightradar24 tracking link

item.appendChild(trackLink);

    item.addEventListener("click", () => {
