<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CVG Airport Route Map</title>

  <!-- Leaflet map library -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
    }

    header {
      padding: 22px;
      text-align: center;
      background: #17243a;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      color: #b9c7d9;
      margin: 0;
    }

    .controls {
      padding: 15px;
      text-align: center;
    }

    select {
      padding: 10px;
      border-radius: 6px;
      font-size: 15px;
    }

    #map {
      height: 72vh;
      min-height: 450px;
      width: 100%;
    }

    .stats {
      text-align: center;
      padding: 15px;
      color: #b9c7d9;
    }

    footer {
      text-align: center;
      padding: 15px;
      font-size: 12px;
      color: #9aabc0;
    }
  </style>
</head>

<body>

<header>
  <h1>CVG Airport Route Network</h1>
  <p>Cincinnati/Northern Kentucky International Airport</p>
</header>

<div class="controls">
  <label for="airlineFilter">Filter by airline: </label>

  <select id="airlineFilter">
    <option value="All">All Airlines</option>
  </select>
</div>

<div id="map"></div>

<div class="stats" id="stats">
  Loading routes...
</div>

<footer>
  Airport route visualization | Data should be independently verified
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

  RDU: {city:"Raleigh",lat:35.8776,lng:-78.7875},
  SLC: {city:"Salt Lake City",lat:40.7899,lng:-111.9791},
  SAN: {city:"San Diego",lat:32.7338,lng:-117.1933},
  SFO: {city:"San Francisco",lat:37.6213,lng:-122.3790},

  SRQ: {city:"Sarasota",lat:27.3954,lng:-82.5544},
  SAV: {city:"Savannah",lat:32.1276,lng:-81.2021},
  SEA: {city:"Seattle",lat:47.4502,lng:-122.3088},
  PIE: {city:"St. Pete / Clearwater",lat:27.9102,lng:-82.6874},
  TPA: {city:"Tampa",lat:27.9755,lng:-82.5332},
  YYZ: {city:"Toronto",lat:43.6777,lng:-79.6248},
  DCA: {city:"Washington Reagan",lat:38.8512,lng:-77.0402},
  IAD: {city:"Washington Dulles",lat:38.9531,lng:-77.4565},
  DJT: {city:"West Palm Beach",lat:26.6832,lng:-80.0956}
};

  // Sample nonstop routes from CVG
  const routes = [
  ["ATL","Delta"],
  ["ATL","Frontier"],
  ["AGS","Delta",true],
  ["AUS","Allegiant",true],
  ["AUS","Delta"],
  ["AUS","Southwest"],
  ["BWI","Southwest"],
  ["BOS","American"],
  ["BOS","Delta"],
  ["CUN","American",true],
  ["CUN","Delta",true],
  ["CUN","Frontier",true],
  ["CUN","Viva Aerobus"],
  ["CHS","Allegiant",true],
  ["CHS","Breeze Airways"],
  ["CLT","American"],
  ["MDW","Southwest"],
  ["ORD","American"],
  ["ORD","United"],
  ["DFW","American"],
  ["DFW","Frontier"],
  ["DEN","Allegiant",true],
  ["DEN","Frontier"],
  ["DEN","Southwest"],
  ["DEN","United"],
  ["VPS","Allegiant"],
  ["DTW","Delta"],
  ["FLL","Allegiant"],
  ["FLL","Delta"],
  ["FLL","Frontier"],
  ["RSW","Delta"],
  ["RSW","Frontier"],
  ["GSP","Breeze Airways",true],
  ["GUF","Allegiant"],
  ["BDL","Breeze Airways",true],
  ["IAH","United"],
  ["JAX","Allegiant"],
  ["EYW","Allegiant"],
  ["LAS","Allegiant"],
  ["LAS","Delta"],
  ["LAS","Frontier"],
  ["LHR","British Airways"],
  ["LAX","Delta"],
  ["LBB","American",true],
  ["MLB","Allegiant"],
  ["MIA","American"],
  ["MIA","Frontier",true],
  ["MSP","Delta"],
  ["MSP","Sun Country",true],
  ["YUL","Air Canada",true],
  ["MYR","Allegiant",true],
  ["BNA","Southwest"],
  ["MSY","Allegiant",true],
  ["JFK","American"],
  ["JFK","Delta"],
  ["LGA","Delta"],
  ["EWR","Allegiant",true],
  ["EWR","Delta"],
  ["EWR","United"],
  ["MCO","Allegiant",true],
  ["MCO","Delta"],
  ["MCO","Frontier"],
  ["MCO","Southwest",true],
  ["SFB","Allegiant"],
  ["CDG","Delta"],
  ["PHL","American"],
  ["AZA","Allegiant"],
  ["PHX","American"],
  ["PHX","Frontier",true],
  ["PHX","Southwest",true],
  ["PWM","Breeze Airways",true],
  ["PDX","Allegiant",true],
  ["PVD","Breeze Airways",true],
  ["PUJ","Vacation Express",true],
  ["PGD","Allegiant"],
  ["RDU","Delta"],
  ["SLC","Delta"],
  ["SAN","Breeze Airways",true],
  ["SFO","Breeze Airways",true],
  ["SFO","United"],
  ["SNA","Allegiant",true],
  ["SRQ","Allegiant"],
  ["SAV","Allegiant"],
  ["SEA","Alaska Airlines"],
  ["SEA","Delta"],
  ["PIE","Allegiant"],
  ["TPA","Delta"],
  ["TPA","Frontier"],
  ["YYZ","Air Canada"],
  ["DCA","American"],
  ["DCA","Delta"],
  ["IAD","United"],
  ["DJT","Allegiant",true]
].map(([to, airline, seasonal = false]) => ({
  to,
  airline,
  seasonal
}));

  // Initialize map
  const map = L.map("map").setView([39, -85], 4);

  // Map background
 L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution:
      '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19
  }
).addTo(map);
  // Airport markers
  const airportLayer = L.layerGroup().addTo(map);

  // Route lines
  const routeLayer = L.layerGroup().addTo(map);

  // Create curved flight route
  function createArc(start, end) {
    const points = [];

    const latDiff = end.lat - start.lat;
    const lngDiff = end.lng - start.lng;

    const distance = Math.sqrt(
      latDiff * latDiff + lngDiff * lngDiff
    );

    const bend = Math.min(distance * 0.16, 12);

    const midLat = (start.lat + end.lat) / 2
      + Math.abs(lngDiff) / distance * bend;

    const midLng = (start.lng + end.lng) / 2
      - latDiff / distance * bend;

    for (let i = 0; i <= 50; i++) {
      const t = i / 50;
      const inverse = 1 - t;

      const lat =
        inverse * inverse * start.lat +
        2 * inverse * t * midLat +
        t * t * end.lat;

      const lng =
        inverse * inverse * start.lng +
        2 * inverse * t * midLng +
        t * t * end.lng;

      points.push([lat, lng]);
    }

    return points;
  }

  // Populate airline dropdown
  const airlines = [
    ...new Set(routes.map(route => route.airline))
  ].sort();

  const filter = document.getElementById("airlineFilter");

  airlines.forEach(airline => {
    const option = document.createElement("option");
    option.value = airline;
    option.textContent = airline;
    filter.appendChild(option);
  });

  // Draw map
  function drawMap() {
    airportLayer.clearLayers();
    routeLayer.clearLayers();

    const selectedAirline = filter.value;

    const filteredRoutes = routes.filter(route =>
      selectedAirline === "All" ||
      route.airline === selectedAirline
    );

    // CVG airport marker
    L.circleMarker(
      [airports.CVG.lat, airports.CVG.lng],
      {
        radius: 9,
        color: "#ffffff",
        fillColor: "#22c55e",
        fillOpacity: 1,
        weight: 3
      }
    )
    .bindPopup("<b>CVG</b><br>Cincinnati/Northern Kentucky")
    .addTo(airportLayer);

    const destinations = new Set();

    filteredRoutes.forEach(route => {
      const destination = airports[route.to];

      if (!destination) return;

      destinations.add(route.to);

      // Flight route
      L.polyline(
        createArc(airports.CVG, destination),
        {
          color: route.seasonal ? "#f59e0b" : "#38bdf8",
          weight: 2,
          opacity: 0.85,
          dashArray: route.seasonal ? "6, 6" : null
        }
      )
      .bindPopup(
        "CVG → " + route.to +
        "<br>Airline: " + route.airline
      )
      .addTo(routeLayer);
    });

    // Destination airport markers
    destinations.forEach(code => {
      const airport = airports[code];

      L.circleMarker(
        [airport.lat, airport.lng],
        {
          radius: 6,
          color: "#ffffff",
          fillColor: "#f59e0b",
          fillOpacity: 1,
          weight: 2
        }
      )
      .bindPopup(
        "<b>" + code + "</b><br>" +
        airport.city +
        "<br>Origin: CVG"
      )
      .addTo(airportLayer);
    });

    document.getElementById("stats").textContent =
      filteredRoutes.length + " route entries | " +
      destinations.size + " destinations";
  }

  filter.addEventListener("change", drawMap);

  drawMap();
</script>

</body>
</html>
